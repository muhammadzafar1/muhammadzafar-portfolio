<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-alt: #f9fbff;
        --border: #e7edf5;
        --text: #0f172a;
        --muted: #52607a;
        --soft: #eef3fb;
        --chip: #edf2fb;
        --chip-active: #111827;
        --chip-active-text: #ffffff;
        --shadow: 0 8px 26px rgba(15, 23, 42, 0.08);
        --shadow-hover: 0 12px 30px rgba(15, 23, 42, 0.12);
        --ring-track: #edf1f7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --panel: #111b2d;
          --panel-alt: #0f172a;
          --border: #22304a;
          --text: #edf3ff;
          --muted: #9fb0c7;
          --soft: #172336;
          --chip: #172336;
          --chip-active: #e2e8f0;
          --chip-active-text: #0f172a;
          --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
          --shadow-hover: 0 14px 34px rgba(2, 6, 23, 0.58);
          --ring-track: #1a2942;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .skills-section {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4rem 0 5rem;
      }

      .skills-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .eyebrow {
        margin: 0;
        color: #5c6df7;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.06;
        letter-spacing: -0.05em;
        font-weight: 800;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.7rem;
        margin: 1.2rem 0 2rem;
      }

      .chip {
        position: relative;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text);
        border-radius: 999px;
        padding: 0.72rem 1rem;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .chip:hover {
        transform: translateY(-1px);
      }

      .chip.is-active {
        background: var(--chip-active);
        color: var(--chip-active-text);
        box-shadow: var(--shadow);
      }

      .chip-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.5rem;
        height: 1.5rem;
        border-radius: 999px;
        font-size: 0.7rem;
        padding: 0 0.45rem;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .chip:focus-visible {
        outline: 3px solid #7c9cff;
        outline-offset: 2px;
      }

      .skill-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
        gap: 1rem;
      }

      .skill-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 1rem 1rem 0.7rem;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        overflow: hidden;
      }

      .skill-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }

      .skill-card[hidden] {
        display: none;
      }

      .skill-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }

      .skill-score {
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .ring-wrap {
        width: 52px;
        height: 52px;
        position: relative;
        flex-shrink: 0;
      }

      .ring-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ring-track {
        fill: none;
        stroke: var(--ring-track);
        stroke-width: 6;
      }

      .ring-progress {
        fill: none;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 122.52;
        stroke-dashoffset: 122.52;
        transition: stroke-dashoffset 1s ease;
      }

      .ring-mono {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.86rem;
        font-weight: 800;
        color: var(--text);
        letter-spacing: 0.02em;
      }

      .skill-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        min-height: 52px;
      }

      .skill-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .skill-name {
        font-size: 1.06rem;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      .skill-tag {
        display: inline-flex;
        align-items: center;
        margin-top: 0.2rem;
        padding: 0.3rem 0.52rem;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 0.64rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        width: fit-content;
      }

      .skill-note {
        margin: 0.9rem 0 0;
        color: var(--muted);
        font-size: 0.83rem;
        line-height: 1.6;
        min-height: 2.8rem;
      }

      .skill-footer {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding-top: 0.7rem;
        margin-top: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.7rem;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .skill-footer strong {
        color: var(--text);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        text-transform: none;
      }

      .skill-years,
      .skill-use {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="skills-section">
      <header class="skills-header">
        <p class="eyebrow">// Expertise</p>
        <h1 class="title">Skills</h1>
      </header>

      <div id="chips" class="chip-row" aria-label="Skill filters"></div>
      <section id="skillGrid" class="skill-grid" aria-live="polite"></section>
    </main>

    <script>
      const DATA = [
        {
          name: 'React',
          mono: 'R',
          tag: 'Frontend',
          score: 96,
          brand: '#5b7cff',
          note: 'Builds polished, interactive interfaces with reusable component patterns.',
          yrs: '6 yrs',
          use: 'Daily'
        },
        {
          name: 'JavaScript',
          mono: 'JS',
          tag: 'Frontend',
          score: 94,
          brand: '#f0b429',
          note: 'Turns complex UI logic into maintainable and predictable application flows.',
          yrs: '7 yrs',
          use: 'Daily'
        },
        {
          name: 'Node.js',
          mono: 'N',
          tag: 'Backend',
          score: 91,
          brand: '#32b768',
          note: 'Creates fast, reliable server-side logic and service orchestration.',
          yrs: '5 yrs',
          use: 'Daily'
        },
        {
          name: 'Python',
          mono: 'PY',
          tag: 'Backend',
          score: 85,
          brand: '#2e6ae6',
          note: 'Builds automation, scripting, and backend tooling with clean abstractions.',
          yrs: '3 yrs',
          use: 'Often'
        },
        {
          name: 'MongoDB',
          mono: 'M',
          tag: 'Database',
          score: 90,
          brand: '#12a86b',
          note: 'Designs efficient schemas and indexes for real-world application data.',
          yrs: '5 yrs',
          use: 'Daily'
        },
        {
          name: 'SQL',
          mono: 'SQL',
          tag: 'Database',
          score: 84,
          brand: '#2f7bf7',
          note: 'Writes clear relational queries and structures data for reporting and APIs.',
          yrs: '4 yrs',
          use: 'Often'
        },
        {
          name: 'Tailwind CSS',
          mono: 'T',
          tag: 'Design',
          score: 92,
          brand: '#38bdf8',
          note: 'Creates responsive, consistent UI systems with swift iteration and polish.',
          yrs: '5 yrs',
          use: 'Daily'
        },
        {
          name: 'Figma',
          mono: 'F',
          tag: 'Design',
          score: 78,
          brand: '#ff6d8a',
          note: 'Turns product ideas into clean, usable prototypes and design flows.',
          yrs: '3 yrs',
          use: 'Weekly'
        }
      ];

      const chipsWrap = document.getElementById('chips');
      const skillGrid = document.getElementById('skillGrid');
      const radius = 22;
      const circumference = 2 * Math.PI * radius;

      const createChip = (tag, count, active) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `chip${active ? ' is-active' : ''}`;
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
        button.dataset.tag = tag;
        button.innerHTML = `${tag}<span class="chip-count">${count}</span>`;
        button.addEventListener('click', () => {
          const selectedTag = button.dataset.tag;
          document.querySelectorAll('.chip').forEach((chip) => {
            const activeState = chip.dataset.tag === selectedTag;
            chip.classList.toggle('is-active', activeState);
            chip.setAttribute('aria-pressed', String(activeState));
          });

          const cards = [...document.querySelectorAll('.skill-card')];
          cards.forEach((card) => {
            const shouldShow = selectedTag === 'All' || card.dataset.tag === selectedTag;
            card.hidden = !shouldShow;
          });
        });
        return button;
      };

      const buildChips = () => {
        const uniqueTags = ['All', ...new Set(DATA.map((item) => item.tag))];
        const totals = uniqueTags.reduce((acc, tag) => {
          acc[tag] = tag === 'All' ? DATA.length : DATA.filter((item) => item.tag === tag).length;
          return acc;
        }, {});

        chipsWrap.innerHTML = '';
        uniqueTags.forEach((tag) => {
          const chip = createChip(tag, totals[tag], tag === 'All');
          chipsWrap.appendChild(chip);
        });
      };

      const setRingProgress = (progressEl, score, brand) => {
        const offset = circumference - (score / 100) * circumference;
        progressEl.style.stroke = brand;
        progressEl.style.strokeDasharray = String(circumference);
        progressEl.style.strokeDashoffset = String(circumference);
        requestAnimationFrame(() => {
          progressEl.style.strokeDashoffset = String(offset);
        });
      };

      const renderSkills = () => {
        skillGrid.innerHTML = '';

        DATA.forEach((skill, index) => {
          const card = document.createElement('article');
          card.className = 'skill-card';
          card.dataset.tag = skill.tag;
          card.hidden = false;

          const offset = circumference - (skill.score / 100) * circumference;

          card.innerHTML = `
            <div class="skill-top">
              <div class="ring-wrap" aria-label="${skill.name} proficiency ${skill.score}%">
                <svg class="ring-svg" viewBox="0 0 56 56" role="img" aria-hidden="true">
                  <circle class="ring-track" cx="28" cy="28" r="22"></circle>
                  <circle class="ring-progress" cx="28" cy="28" r="22" style="stroke:${skill.brand}; stroke-dasharray:${circumference}; stroke-dashoffset:${circumference};"></circle>
                </svg>
                <div class="ring-mono">${skill.mono}</div>
              </div>
              <div class="skill-score">${skill.score}%</div>
            </div>

            <div class="skill-main">
              <div class="skill-info">
                <div class="skill-name">${skill.name}</div>
                <div class="skill-tag">${skill.tag}</div>
              </div>
            </div>

            <p class="skill-note">${skill.note}</p>

            <div class="skill-footer">
              <span class="skill-years">Years <strong>${skill.yrs}</strong></span>
              <span class="skill-use">Use <strong>${skill.use}</strong></span>
            </div>
          `;

          const progressRing = card.querySelector('.ring-progress');
          setTimeout(() => {
            progressRing.style.strokeDashoffset = String(offset);
          }, index * 70);

          skillGrid.appendChild(card);
        });
      };

      buildChips();
      renderSkills();
    </script>
  </body>
</html>
